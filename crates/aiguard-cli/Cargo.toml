aiguard-replay = { path = "../aiguard-replay", version = "0.1.0" }
aiguard-adapter-aider = { path = "../aiguard-adapter-aider", version = "0.1.0" }
aiguard-mcp-proxy = { path = "../aiguard-mcp-proxy", version = "0.1.0" }
clap = { workspace = true }
clap_complete = { workspace = true }
