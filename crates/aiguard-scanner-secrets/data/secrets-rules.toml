[[rule]]
id = "aws-access-key-id"
description = "AWS Access Key ID"
regex = '(?:AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16}'
entropy = 3.2
keywords = ["AKIA", "ABIA", "ACCA", "ASIA"]

[[rule]]
id = "aws-secret-access-key"
description = "AWS Secret Access Key"
regex = '(?i)aws_secret_access_key\s*[:=]\s*[A-Za-z0-9/+=]{40}'
entropy = 4.0
keywords = ["aws_secret"]

[[rule]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = 'sk-ant-(?:api|admin)\d{2}-[A-Za-z0-9\-_]{80,}'
entropy = 4.0
keywords = ["sk-ant-"]

[[rule]]
id = "openai-api-key"
description = "OpenAI API key"
regex = 'sk-(?:proj|svcacct|admin)-[A-Za-z0-9\-_]{20,}'
entropy = 4.0
keywords = ["sk-proj", "sk-svcacct", "sk-admin"]

[[rule]]
id = "github-pat"
description = "GitHub Personal Access Token"
regex = 'ghp_[A-Za-z0-9]{36,}'
entropy = 3.5
keywords = ["ghp_"]

[[rule]]
id = "github-oauth"
description = "GitHub OAuth Access Token"
regex = 'gho_[A-Za-z0-9]{36,}'
entropy = 3.5
keywords = ["gho_"]

[[rule]]
id = "github-app-token"
description = "GitHub App Token"
regex = 'ghu_[A-Za-z0-9]{36,}'
entropy = 3.5
keywords = ["ghu_"]

[[rule]]
id = "github-fine-grained"
description = "GitHub Fine-Grained Token"
regex = 'github_pat_[A-Za-z0-9_]{30,}'
entropy = 3.5
keywords = ["github_pat_"]

[[rule]]
id = "gitlab-token"
description = "GitLab Token"
regex = 'glpat-[A-Za-z0-9\-_]{20,}'
entropy = 3.5
keywords = ["glpat-"]

[[rule]]
id = "stripe-secret-key"
description = "Stripe Secret Key"
regex = 'sk_live_[A-Za-z0-9]{24,}'
entropy = 3.5
keywords = ["sk_live_"]

[[rule]]
id = "stripe-publishable-key"
description = "Stripe Publishable Key"
regex = 'pk_live_[A-Za-z0-9]{24,}'
entropy = 3.5
keywords = ["pk_live_"]

[[rule]]
id = "stripe-restricted-key"
description = "Stripe Restricted Key"
regex = 'rk_live_[A-Za-z0-9]{24,}'
entropy = 3.5
keywords = ["rk_live_"]

[[rule]]
id = "slack-bot-token"
description = "Slack Bot Token"
regex = 'xoxb-[A-Za-z0-9\-]{10,}'
entropy = 3.0
keywords = ["xoxb-"]

[[rule]]
id = "slack-user-token"
description = "Slack User Token"
regex = 'xoxp-[A-Za-z0-9\-]{10,}'
entropy = 3.0
keywords = ["xoxp-"]

[[rule]]
id = "slack-app-token"
description = "Slack App Token"
regex = 'xoxa-[A-Za-z0-9\-]{10,}'
entropy = 3.0
keywords = ["xoxa-"]

[[rule]]
id = "slack-webhook"
description = "Slack Webhook URL"
regex = 'https://hooks\.slack\.com/services/T[A-Z0-9]+/B[A-Z0-9]+/[A-Za-z0-9]+'
entropy = 3.0
keywords = ["hooks.slack.com"]

[[rule]]
id = "twilio-api-key"
description = "Twilio API Key"
regex = 'SK[0-9a-fA-F]{32}'
entropy = 3.5
keywords = ["SK"]

[[rule]]
id = "sendgrid-api-key"
description = "SendGrid API Key"
regex = 'SG\.[A-Za-z0-9\-_]{22,}\.[A-Za-z0-9\-_]{22,}'
entropy = 4.0
keywords = ["SG."]

[[rule]]
id = "mailgun-api-key"
description = "Mailgun API Key"
regex = 'key-[0-9a-zA-Z]{32}'
entropy = 3.5
keywords = ["key-"]

[[rule]]
id = "npm-token"
description = "npm Access Token"
regex = 'npm_[A-Za-z0-9]{36,}'
entropy = 3.5
keywords = ["npm_"]

[[rule]]
id = "pypi-token"
description = "PyPI API Token"
regex = 'pypi-[A-Za-z0-9\-_]{50,}'
entropy = 4.0
keywords = ["pypi-"]

[[rule]]
id = "heroku-api-key"
description = "Heroku API Key"
regex = '(?i)heroku[_\s]*(?:api[_\s]*)?key\s*[:=]\s*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
entropy = 3.5
keywords = ["heroku"]

[[rule]]
id = "digitalocean-token"
description = "DigitalOcean Token"
regex = 'dop_v1_[a-f0-9]{64}'
entropy = 4.0
keywords = ["dop_v1_"]

[[rule]]
id = "digitalocean-oauth"
description = "DigitalOcean OAuth Token"
regex = 'doo_v1_[a-f0-9]{64}'
entropy = 4.0
keywords = ["doo_v1_"]

[[rule]]
id = "cloudflare-api-key"
description = "Cloudflare API Key"
regex = '(?i)cloudflare[_\s]*(?:api[_\s]*)?key\s*[:=]\s*[A-Za-z0-9]{37,}'
entropy = 3.5
keywords = ["cloudflare"]

[[rule]]
id = "datadog-api-key"
description = "Datadog API Key"
regex = '(?i)dd[-_]?api[-_]?key\s*[:=]\s*[a-f0-9]{32}'
entropy = 3.5
keywords = ["dd_api", "dd-api", "datadog"]

[[rule]]
id = "rsa-private-key"
description = "RSA Private Key"
regex = '-----BEGIN RSA PRIVATE KEY-----'
keywords = ["BEGIN RSA PRIVATE KEY"]
entropy = 0.0

[[rule]]
id = "dsa-private-key"
description = "DSA Private Key"
regex = '-----BEGIN DSA PRIVATE KEY-----'
keywords = ["BEGIN DSA PRIVATE KEY"]
entropy = 0.0

[[rule]]
id = "ec-private-key"
description = "EC Private Key"
regex = '-----BEGIN EC PRIVATE KEY-----'
keywords = ["BEGIN EC PRIVATE KEY"]
entropy = 0.0

[[rule]]
id = "openssh-private-key"
description = "OpenSSH Private Key"
regex = '-----BEGIN OPENSSH PRIVATE KEY-----'
keywords = ["BEGIN OPENSSH PRIVATE KEY"]
entropy = 0.0

[[rule]]
id = "pgp-private-key"
description = "PGP Private Key"
regex = '-----BEGIN PGP PRIVATE KEY BLOCK-----'
keywords = ["BEGIN PGP PRIVATE KEY"]
entropy = 0.0

[[rule]]
id = "jwt-token"
description = "JSON Web Token"
regex = 'eyJ[A-Za-z0-9\-_]{10,}\.eyJ[A-Za-z0-9\-_]{10,}\.[A-Za-z0-9\-_]{10,}'
entropy = 4.0
keywords = ["eyJ"]

[[rule]]
id = "postgres-connection-string"
description = "PostgreSQL Connection String"
regex = "postgres(?:ql)?://[^\\s\"'<>{}|\\\\^`]{10,}"
entropy = 3.0
keywords = ["postgres://", "postgresql://"]

[[rule]]
id = "mysql-connection-string"
description = "MySQL Connection String"
regex = "mysql://[^\\s\"'<>{}|\\\\^`]{10,}"
entropy = 3.0
keywords = ["mysql://"]

[[rule]]
id = "mongodb-connection-string"
description = "MongoDB Connection String"
regex = "mongodb(?:\\+srv)?://[^\\s\"'<>{}|\\\\^`]{10,}"
entropy = 3.0
keywords = ["mongodb://", "mongodb+srv://"]

[[rule]]
id = "telegram-bot-token"
description = "Telegram Bot Token"
regex = '\d{8,10}:[A-Za-z0-9_\-]{35}'
entropy = 3.5
keywords = ["bot", "telegram"]

[[rule]]
id = "discord-bot-token"
description = "Discord Bot Token"
regex = '[MN][A-Za-z\d]{23,}\.[\w-]{6}\.[\w-]{27,}'
entropy = 4.0
keywords = ["discord"]

[[rule]]
id = "firebase-api-key"
description = "Firebase API Key"
regex = 'AIza[0-9A-Za-z\-_]{35}'
entropy = 3.5
keywords = ["AIza"]

[[rule]]
id = "supabase-key"
description = "Supabase Service Key"
regex = 'sbp_[a-f0-9]{40}'
entropy = 4.0
keywords = ["sbp_"]

[[rule]]
id = "vault-token"
description = "HashiCorp Vault Token"
regex = 'hvs\.[A-Za-z0-9]{24,}'
entropy = 3.5
keywords = ["hvs."]

[[rule]]
id = "shopify-token"
description = "Shopify Access Token"
regex = 'shpat_[a-fA-F0-9]{32}'
entropy = 3.5
keywords = ["shpat_"]

[[rule]]
id = "shopify-secret"
description = "Shopify Shared Secret"
regex = 'shpss_[a-fA-F0-9]{32}'
entropy = 3.5
keywords = ["shpss_"]

[[rule]]
id = "azure-storage-key"
description = "Azure Storage Account Key"
regex = '(?i)(?:DefaultEndpointsProtocol|AccountKey)\s*=\s*[A-Za-z0-9+/=]{44,}'
entropy = 4.0
keywords = ["DefaultEndpointsProtocol", "AccountKey"]

[[rule]]
id = "gcp-service-account"
description = "GCP Service Account Key JSON"
regex = '"private_key":\s*"-----BEGIN'
keywords = ["private_key", "BEGIN"]

[[rule]]
id = "docker-hub-token"
description = "Docker Hub Token"
regex = 'dckr_pat_[A-Za-z0-9\-_]{20,}'
entropy = 3.5
keywords = ["dckr_pat_"]

[[rule]]
id = "generic-password-assignment"
description = "Generic Password Assignment"
regex = '(?i)(?:password|passwd|pwd)\s*[:=]\s*["\u0027][^\s"\u0027]{8,}["\u0027]'
entropy = 3.5
keywords = ["password", "passwd", "pwd"]

[[rule]]
id = "generic-secret-assignment"
description = "Generic Secret Assignment"
regex = '(?i)(?:secret|api_?key|auth_?token|access_?token)\s*[:=]\s*["\u0027][^\s"\u0027]{8,}["\u0027]'
entropy = 3.5
keywords = ["secret", "api_key", "apikey", "auth_token", "access_token"]

[[rule]]
id = "age-secret-key"
description = "Age Secret Key"
regex = 'AGE-SECRET-KEY-1[QPZRY9X8GF2TVDW0S3JN54KHCE6MUA7L]{58}'
entropy = 4.0
keywords = ["AGE-SECRET-KEY"]

[[rule]]
id = "doppler-token"
description = "Doppler Token"
regex = 'dp\.st\.[a-z0-9\-_]{40,}'
entropy = 3.5
keywords = ["dp.st."]

[[rule]]
id = "linear-api-key"
description = "Linear API Key"
regex = 'lin_api_[A-Za-z0-9]{40,}'
entropy = 3.5
keywords = ["lin_api_"]

[[rule]]
id = "vercel-token"
description = "Vercel Token"
regex = '(?i)vercel[_\s]*(?:api[_\s]*)?token\s*[:=]\s*[A-Za-z0-9]{24,}'
entropy = 3.5
keywords = ["vercel"]

[[rule]]
id = "netlify-token"
description = "Netlify Token"
regex = '(?i)netlify[_\s]*(?:auth[_\s]*)?token\s*[:=]\s*[A-Za-z0-9\-_]{40,}'
entropy = 3.5
keywords = ["netlify"]
