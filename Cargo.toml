[workspace]
resolver = "2"
members = [
  "crates/aiguard-core",
  "crates/aiguard-cli",
  "crates/aiguard-adapter-shellhook",
  "crates/aiguard-adapter-opencode",
  "crates/aiguard-adapter-aider",
  "crates/aiguard-adapter-goose",
  "crates/aiguard-scanner-prompt-injection",
  "crates/aiguard-scanner-mcp",
  "crates/aiguard-scanner-secrets",
  "crates/aiguard-replay",
  "crates/aiguard-mcp-proxy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Adarsh"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/anonymousAAK/aiguard"

[workspace.dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"

# Config + serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
figment = { version = "0.10", features = ["toml", "env"] }
ciborium = "0.2"

# Async + IO
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "io-util", "process", "fs", "time", "signal"] }
async-trait = "0.1"
futures = "0.3"

# Error + logging
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
zstd = "0.13"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }

# Regex + matching
regex = "1.10"
aho-corasick = "1.1"
fancy-regex = "0.13"

# Filesystem + paths
notify = "6.1"
directories = "5.0"
walkdir = "2.5"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Misc
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
once_cell = "1.19"
which = "7.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }

# Testing
insta = { version = "1.40", features = ["yaml", "redactions"] }
proptest = "1.5"
criterion = "0.5"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
